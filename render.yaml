services:
  - name: artexo-study-buddy
    type: web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TIMESCALE_SERVICE_URL
        fromDatabase:
          name: artexo_study_buddy_db
          property: connectionString

databases:
  - name: artexo_study_buddy_db
    databaseName: artexo_study_buddy
    user: artexo_user
    plan: free
    ipAllowList: []
